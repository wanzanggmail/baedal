# main/master 브랜치 push 시 실서버에 rsync 배포
# GitHub 저장소 → Settings → Secrets and variables → Actions 에서 시크릿 등록 (DEPLOY.md 참고)

name: Deploy to server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          test -n "${{ secrets.DEPLOY_HOST }}" || (echo "DEPLOY_HOST secret missing" && exit 1)
          test -n "${{ secrets.DEPLOY_USER }}" || (echo "DEPLOY_USER secret missing" && exit 1)
          test -n "${{ secrets.DEPLOY_PATH }}" || (echo "DEPLOY_PATH secret missing" && exit 1)
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || (echo "DEPLOY_SSH_KEY secret missing" && exit 1)

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync files to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          DEST="${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          RSYNC_SSH="ssh -i ~/.ssh/deploy_key -p ${PORT} -o StrictHostKeyChecking=yes"

          rsync -az --delete --info=stats2 \
            -e "$RSYNC_SSH" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '!.env.example' \
            --exclude 'uploads/' \
            --exclude 'storage/' \
            --exclude 'vendor/' \
            --exclude 'node_modules/' \
            --exclude 'inc/*.flag' \
            --exclude '.DS_Store' \
            --exclude 'Thumbs.db' \
            --exclude '*.log' \
            --exclude 'migrate.php' \
            --exclude 'seed.php' \
            --exclude 'seed.sql' \
            ./ "$DEST"

      - name: Install composer dependencies on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          # vendor/ 는 위 rsync에서 --exclude 되므로(용량·권한 문제 회피), PHP 의존성(Parsedown,
          # PhpSpreadsheet 등)은 서버에서 composer.lock 기준으로 직접 설치한다. 이 단계가 없으면
          # 코드는 배포돼도 vendor/가 서버에 전혀 존재하지 않아 "Class ... not found"로 즉시 죽는다
          # (실제로 겪은 장애: ManualDocs.php의 Parsedown).
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e; cd '${DEPLOY_PATH}'; \
             if command -v composer >/dev/null 2>&1; then \
               composer install --no-dev --optimize-autoloader --no-interaction; \
             else \
               php -r \"copy('https://getcomposer.org/installer', 'composer-setup.php');\"; \
               php composer-setup.php --quiet; \
               rm -f composer-setup.php; \
               php composer.phar install --no-dev --optimize-autoloader --no-interaction; \
               rm -f composer.phar; \
             fi"

      - name: Fix permissions (optional)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_POST_CMD: ${{ secrets.DEPLOY_POST_CMD }}
        run: |
          if [ -z "${DEPLOY_POST_CMD}" ]; then
            echo "DEPLOY_POST_CMD not set, skipping post-deploy command"
            exit 0
          fi
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${DEPLOY_POST_CMD}"
