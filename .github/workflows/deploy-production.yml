# production 브랜치 push 시 라이브 서버(AWS EC2)에 rsync 배포.
# "production" 환경에 승인자(Required reviewers)를 지정해두면, 여기서 배포가 잠시
# 멈추고 지정된 사람이 GitHub Actions 화면에서 승인 버튼을 눌러야 실제로 진행된다.
# 결제·펌뱅킹이 붙은 실서버라 실수 방지를 위해 반드시 승인 게이트를 걸어둘 것.
#
# GitHub 저장소 → Settings → Environments → "production" 환경 생성 →
#   1) Required reviewers 체크 → 본인/책임자 지정
#   2) Environment secrets 에 DEPLOY_HOST(EC2 EIP)·DEPLOY_USER(ec2-user)·
#      DEPLOY_PATH(/var/www/html)·DEPLOY_SSH_KEY(라이브 서버 pem 전체) 등록
#      (staging 환경의 시크릿과 이름은 같아도 값은 완전히 다른 라이브 서버 것)
#
# 브랜치 전략: main(테스트, 자동배포)에서 검증 끝난 커밋만 production 브랜치로
# 병합/fast-forward 하면 이 워크플로우가 트리거된다.
#   git checkout production && git merge main && git push origin production

name: Deploy to production

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # 라이브 배포는 취소보다 순서대로 끝까지 진행이 안전

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          test -n "${{ secrets.DEPLOY_HOST }}" || (echo "DEPLOY_HOST secret missing" && exit 1)
          test -n "${{ secrets.DEPLOY_USER }}" || (echo "DEPLOY_USER secret missing" && exit 1)
          test -n "${{ secrets.DEPLOY_PATH }}" || (echo "DEPLOY_PATH secret missing" && exit 1)
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || (echo "DEPLOY_SSH_KEY secret missing" && exit 1)

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync files to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          DEST="${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          RSYNC_SSH="ssh -i ~/.ssh/deploy_key -p ${PORT} -o StrictHostKeyChecking=yes"

          rsync -az --delete --info=stats2 \
            -e "$RSYNC_SSH" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '!.env.example' \
            --exclude 'uploads/' \
            --exclude 'storage/' \
            --exclude 'vendor/' \
            --exclude 'node_modules/' \
            --exclude 'inc/*.flag' \
            --exclude '.DS_Store' \
            --exclude 'Thumbs.db' \
            --exclude '*.log' \
            --exclude 'migrate.php' \
            --exclude 'seed.php' \
            --exclude 'seed.sql' \
            ./ "$DEST"

      - name: Install composer dependencies on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e; cd '${DEPLOY_PATH}'; \
             if command -v composer >/dev/null 2>&1; then \
               composer install --no-dev --optimize-autoloader --no-interaction; \
             else \
               php -r \"copy('https://getcomposer.org/installer', 'composer-setup.php');\"; \
               php composer-setup.php --quiet; \
               rm -f composer-setup.php; \
               php composer.phar install --no-dev --optimize-autoloader --no-interaction; \
               rm -f composer.phar; \
             fi"

      - name: Fix permissions (optional)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_POST_CMD: ${{ secrets.DEPLOY_POST_CMD }}
        run: |
          if [ -z "${DEPLOY_POST_CMD}" ]; then
            echo "DEPLOY_POST_CMD not set, skipping post-deploy command"
            exit 0
          fi
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${DEPLOY_POST_CMD}"
